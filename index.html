</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v7a4 4 0 0 0 4 4h2M13 15l-4-4m4 4-4 4M13 15h6V4"/></svg></div>ledgerline<span style="color:#718fff">.</span></div><div class="workspace"><small>Workspace</small><div class="switch"><span>✦ &nbsp; Northstar Studio</span><span class="muted">⌄</span></div></div><div><div class="navlabel">Workspace</div><nav class="nav" id="nav"><button data-view="overview" class="active"><span class="ico">◫</span>Overview</button><button data-view="meetings"><span class="ico">◷</span>Meetings</button><button data-view="review"><span class="ico">✳</span>Review queue <span class="count" id="reviewCount">3</span></button><button data-view="memory"><span class="ico">◈</span>Decision memory</button><button data-view="tasks"><span class="ico">▦</span>Execution board</button><button data-view="insights"><span class="ico">⌁</span>Insights</button></nav></div><div class="sidebottom"><div class="navlabel">System</div><nav class="nav"><button data-view="integrations"><span class="ico">⛓</span>Integrations</button><button data-view="settings"><span class="ico">⚙</span>Settings</button></nav></div><div class="profile"><div class="avatar">AK</div><div><strong>Arpita Kamboj</strong><small>Workspace admin</small></div><span class="muted" style="margin-left:auto">···</span></div></aside><section class="main"><header class="topbar"><div class="crumb">Workspace <span style="color:#4f5d72">/</span> <b id="crumb">Overview</b></div><div class="topactions"><div class="status" id="connection"><span class="dot"></span><span>Demo workspace</span></div><button class="btn ghost" id="helpBtn">? Help</button><button class="btn primary" id="topNew">＋ New meeting</button></div></header><main class="content" id="app"></main></section></div><div id="modalroot"></div><div id="toastroot"></div>
<script>
const $=s=>document.querySelector(s),today=()=>new Date().toISOString().slice(0,10),fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'No deadline',uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed={meetings:[{id:'m1',title:'Product architecture kickoff',date:'2026-11-12',attendees:['Priya','Rahul','Anita'],transcript:'Priya: We decided to use PostgreSQL as the primary database for transactional data.\nRahul: I will prepare the schema and migration plan by Friday.\nAnita: I will document the API contracts by next Monday.',decisions:2},{id:'m2',title:'Sprint planning & delivery',date:'2026-11-17',attendees:['Priya','Rahul','Anita'],transcript:'Rahul: We agreed to ship the MVP behind a feature flag.\nPriya: Anita, can you prepare the onboarding flow by next Friday?\nAnita: I will also update the release checklist tomorrow.',decisions:1}],decisions:[{id:'d1',meeting:'m1',text:'Use PostgreSQL as the primary database',quote:'We decided to use PostgreSQL as the primary database for transactional data.',speaker:'Priya',time:'00:01:42',status:'active',confidence:96,category:'Technology'},{id:'d2',meeting:'m1',text:'Prepare database schema and migration plan',quote:'I will prepare the schema and migration plan by Friday.',speaker:'Rahul',time:'00:02:18',status:'active',confidence:93,category:'Delivery'},{id:'d3',meeting:'m2',text:'Ship the MVP behind a feature flag',quote:'We agreed to ship the MVP behind a feature flag.',speaker:'Rahul',time:'00:00:58',status:'active',confidence:97,category:'Release'}],tasks:[{id:'t1',title:'Prepare database schema and migration plan',owner:'Rahul',due:'2026-11-24',status:'doing',source:'Product architecture kickoff'},{id:'t2',title:'Document API contracts',owner:'Anita',due:'2026-11-23',status:'todo',source:'Product architecture kickoff'},{id:'t3',title:'Prepare onboarding flow',owner:'Anita',due:'2026-11-28',status:'todo',source:'Sprint planning & delivery'},{id:'t4',title:'Set up feature-flag rollout checklist',owner:'Rahul',due:'2026-11-21',status:'done',source:'Sprint planning & delivery'}],conflicts:[],audit:[{text:'Decision approved: PostgreSQL as primary database',when:'Today · 10:42'},{text:'Action item assigned to Rahul',when:'Today · 10:38'},{text:'Meeting transcript processed',when:'Yesterday · 16:21'}],review:[]};
let db=load(),view='overview',apiBase=localStorage.getItem('ll_api')||'http://127.0.0.1:8000',apiOnline=false;
function load(){try{return JSON.parse(localStorage.getItem('ledgerline_v2'))||structuredClone(seed)}catch{return structuredClone(seed)}}function save(){localStorage.setItem('ledgerline_v2',JSON.stringify(db));$('#reviewCount').textContent=db.review.length+db.conflicts.filter(c=>!c.resolved).length}
function toast(msg){$('#toastroot').innerHTML=`<div class="toast">✓ &nbsp;${esc(msg)}</div>`;setTimeout(()=>$('#toastroot').innerHTML='',2600)}function setView(v){view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#crumb').textContent=({overview:'Overview',meetings:'Meetings',review:'Review queue',memory:'Decision memory',tasks:'Execution board',insights:'Insights',integrations:'Integrations',settings:'Settings'})[v]||v;render()}
function badge(s){let c=({active:'green',approved:'green',pending:'amber',superseded:'purple',conflict:'red',todo:'',doing:'amber',done:'green'})[s]||'';return `<span class="pill ${c}">${esc(s)}</span>`}function meetingName(id){return db.meetings.find(m=>m.id===id)?.title||'Meeting'}function addAudit(text){db.audit.unshift({text,when:'Just now'})}
function pageHead(eyebrow,title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${action?`<div class="actions">${action}</div>`:''}</div>`}
function overview(){let pending=db.review.length,conf=db.conflicts.filter(c=>!c.resolved).length,open=db.tasks.filter(t=>t.status!=='done').length,done=db.tasks.filter(t=>t.status==='done').length,rate=db.tasks.length?Math.round(done/db.tasks.length*100):0;return `${pageHead(new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}).toUpperCase(),'Decisions that move work forward.','Your team’s commitments, context and follow-through — all in one place.',`<button class="btn" onclick="loadSampleConflict()">▶ Run live demo</button><button class="btn primary" onclick="openMeeting()">＋ New meeting</button>`)}<div class="grid stats"><div class="card stat" style="--glow:#718fff"><div class="statlabel">Decisions remembered <span>◈</span></div><div class="statnum">${db.decisions.length}</div><div class="statfoot positive">↑ Persistent team memory</div></div><div class="card stat" style="--glow:#f5bd63"><div class="statlabel">Needs your review <span>✳</span></div><div class="statnum">${pending+conf}</div><div class="statfoot ${pending+conf?'warning':'positive'}">${pending+conf?'Waiting for approval':'All caught up'}</div></div><div class="card stat" style="--glow:#4bd3a1"><div class="statlabel">Open commitments <span>▦</span></div><div class="statnum">${open}</div><div class="statfoot">${done} completed so far</div></div><div class="card stat" style="--glow:#b99aff"><div class="statlabel">Execution rate <span>⌁</span></div><div class="statnum">${rate}%</div><div class="statfoot">Based on tracked tasks</div></div></div><div class="grid twocol"><div class="card"><div class="sectiontitle"><h2>Recent meeting activity</h2><button class="btn ghost" onclick="setView('meetings')">View all →</button></div><div class="feed">${db.meetings.slice().reverse().slice(0,4).map(m=>`<div class="feeditem"><div class="feedicon">◷</div><div style="flex:1"><strong>${esc(m.title)}</strong><p>${fmt(m.date)} · ${m.attendees.length} attendees · ${m.decisions||0} extracted decisions</p></div>${badge('processed')}</div>`).join('')||'<div class="empty">No meetings yet. Add your first transcript.</div>'}</div></div><div class="card"><div class="sectiontitle"><h2>Execution pulse</h2><span class="pill green">Live overview</span></div><div style="display:flex;justify-content:space-between;align-items:end;margin:18px 0 9px"><div><div class="statnum" style="font-size:27px;margin:0">${rate}%</div><div class="muted small">Tasks completed</div></div><div class="muted small">${done} of ${db.tasks.length}</div></div><div class="bar"><span style="width:${rate}%"></span></div><div style="margin-top:22px"><div class="sectiontitle"><h2>Upcoming commitments</h2><button class="btn ghost" onclick="setView('tasks')">Board →</button></div>${db.tasks.filter(t=>t.status!=='done').sort((a,b)=>(a.due||'').localeCompare(b.due||'')).slice(0,3).map(t=>`<div class="taskrow"><div><strong>${esc(t.title)}</strong><small>${esc(t.owner||'Unassigned')} · ${fmt(t.due)}</small></div>${badge(t.status)}</div>`).join('')||'<p class="muted small">No open commitments.</p>'}</div></div></div><div class="grid twocol"><div class="card"><div class="sectiontitle"><h2>Decision memory</h2><button class="btn ghost" onclick="setView('memory')">Explore ledger →</button></div>${db.decisions.slice(-3).reverse().map(d=>`<div class="taskrow"><div><strong>${esc(d.text)}</strong><small>${esc(d.speaker)} · ${esc(meetingName(d.meeting))}</small></div>${badge(d.status)}</div>`).join('')||'<p class="muted">No decisions recorded yet.</p>'}</div><div class="card"><div class="sectiontitle"><h2>Activity log</h2><span class="muted small">Latest events</span></div>${db.audit.slice(0,4).map(a=>`<div class="taskrow"><div><strong>${esc(a.text)}</strong><small>${esc(a.when)}</small></div><span class="pill green">✓</span></div>`).join('')}</div></div>`}
function meetings(){return `${pageHead('MEETING INTELLIGENCE','Every conversation has a next step.','Upload a transcript. Ledgerline extracts decisions, owners and deadlines, then checks them against your team’s memory.',`<button class="btn primary" onclick="openMeeting()">＋ Process a meeting</button>`)}<div class="card"><div class="sectiontitle"><h2>Meeting history</h2><span class="muted small">${db.meetings.length} meetings</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Meeting</th><th>Date</th><th>Attendees</th><th>Decisions</th><th>Status</th><th></th></tr></thead><tbody>${db.meetings.map(m=>`<tr><td><strong>${esc(m.title)}</strong></td><td>${fmt(m.date)}</td><td>${m.attendees.map(esc).join(', ')}</td><td>${m.decisions||0}</td><td>${badge('processed')}</td><td><button class="btn" onclick="viewMeeting('${m.id}')">Open</button></td></tr>`).join('')||'<tr><td colspan="6">No meetings yet.</td></tr>'}</tbody></table></div></div>`}

">Approve & ${r.type==='task'?'create task':'save decision'}</button></div></div>`).join('')} ${!conflicts.length&&!db.review.length?'<div class="card empty"><div class="big">✓</div><strong>All clear. Nothing needs your attention.</strong><p>Your team is up to date.</p><button class="btn primary" onclick="openMeeting()">Process another meeting</button></div>':''}`}

function parseTranscript(text){let lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),dec=[],tasks=[],people=new Set();for(let line of lines){let m=line.match(/^(?:\[?(\d{2}:\d{2}(?::\d{2})?)\]?\s*)?([^:]{1,35}):\s*(.+)$/);if(!m)continue;let time=m[1]||'00:00',speaker=m[2].trim(),s=m[3].trim();people.add(speaker);if(/\b(we decided|we agreed|let's use|let’s use|we will use|we'll use|we should use|decision is to|agreed to)\b/i.test(s)){dec.push({id:uid(),type:'decision',text:s.replace(/^(we decided to|we agreed to|we decided|we agreed)/i,'').trim(),quote:s,speaker,time,confidence:90,category:/database|postgres|mongo|mysql|sql/i.test(s)?'Technology':'General'})}if(/\b(i will|i'll|i shall|can you|please|responsible for|will prepare|will update|will create|will deliver)\b/i.test(s)){let owner=speaker,om=s.match(/^([A-Z][a-z]+),?\s+can you/i);if(om)owner=om[1];let due=null;if(/tomorrow/i.test(s)){let d=new Date();d.setDate(d.getDate()+1);due=d.toISOString().slice(0,10)}else if(/friday/i.test(s)){let d=new Date();d.setDate(d.getDate()+(5-d.getDay()+7)%7||7);due=d.toISOString().slice(0,10)}tasks.push({id:uid(),type:'task',text:s,quote:s,speaker,time,owner,due,confidence:86})}}

async function api(path, options={}){
  const headers={...(options.headers||{})};
  if(options.body && !(options.body instanceof FormData) && typeof options.body!=='string'){
    headers['Content-Type']='application/json'; options.body=JSON.stringify(options.body);
  }
  const response=await fetch(apiBase+path,{...options,headers});
  const raw=await response.text(); let payload={};
  try{payload=raw?JSON.parse(raw):{}}catch{payload={detail:raw}}
  if(!response.ok) throw new Error(payload.detail||payload.message||`API error ${response.status}`);

const tsLabel=v=>{if(v===null||v===undefined)return '--:--';let n=Math.max(0,Math.floor(Number(v)));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`};
function mapDecision(d){return {id:String(d.id),backendId:d.id,meeting:String(d.meeting_id),text:d.text,quote:d.quote,speaker:d.speaker_name||'Unknown',time:tsLabel(d.timestamp),status:d.status||'active',confidence:Math.round((d.confidence||0)*100),category:(d.keywords||[]).slice(0,2).join(', ')||'General'}}
function mapAction(a){return {id:String(a.id),backendId:a.id,type:'task',text:a.title,quote:a.quote||'',speaker:a.speaker_name||'Unknown',time:tsLabel(a.timestamp),owner:a.owner_name||'',due:isoDay(a.deadline),confidence:Math.round((a.confidence||0)*100),meeting:String(a.meeting_id),source:a.meeting_title||'Meeting',status:a.task_status==='in_progress'?'doing':a.task_status||'todo'}}
function mapConflict(c){return {id:String(c.id),backendId:c.id,kind:c.verdict==='supersedes'?'Decision supersession':'Potential contradiction',title:c.verdict==='supersedes'?'A new decision may supersede an earlier commitment':'A new decision conflicts with an earlier commitment',old:c.old?.text||'',next:c.new?.text||'',oldMeeting:c.old?.meeting_title||'Earlier meeting',newMeeting:c.new?.meeting_title||'Current meeting',reason:c.rationale||'Related decisions were found in organizational memory. Review the evidence before resolving.',oldId:String(c.old_decision_id),newDecision:mapDecision(c.new||{}),resolved:c.resolution!=='pending',resolution:c.resolution}}
async function syncBackend(){
  if(!backendMode)return;
  const [meetingsData,reviewData,decisionsData,conflictsData,tasksData,auditData]=await Promise.all([
    api('/api/meetings'),api('/api/review'),api('/api/decisions'),api('/api/conflicts?status=pending'),api('/api/tasks'),api('/api/audit?limit=40')
  ]);
  const meetingDetails=await Promise.all(meetingsData.map(async m=>{
    try{const d=await api(`/api/meetings/${m.id}`);return {id:String(m.id),backendId:m.id,title:m.title,date:isoDay(m.meeting_date),attendees:m.attendees||[],transcript:d.meeting?.raw_text||'',decisions:0,status:m.status}}
    catch{return {id:String(m.id),backendId:m.id,title:m.title,date:isoDay(m.meeting_date),attendees:m.attendees||[],transcript:'',decisions:0,status:m.status}}
  }));
  const pendingDecisions=(reviewData.decisions||[]).map(d=>({...mapDecision(d),type:'decision',meeting:String(d.meeting_id)}));
  const pendingActions=(reviewData.actions||[]).map(a=>({...mapAction(a),type:'task'}));
  const allDecisions=[...decisionsData.map(mapDecision)];
  const meetingCounts={}; allDecisions.forEach(d=>meetingCounts[d.meeting]=(meetingCounts[d.meeting]||0)+1);
  meetingDetails.forEach(m=>m.decisions=meetingCounts[m.id]||0);
  db.meetings=meetingDetails;
  db.review=[...pendingDecisions,...pendingActions];
  db.decisions=allDecisions;
  db.conflicts=(conflictsData||[]).map(mapConflict);
  db.tasks=(tasksData||[]).map(mapAction);
  db.audit=(auditData||[]).map(a=>({text:`${a.action||'Activity'} · ${a.entity_type||''} #${a.entity_id||''}`,when:a.created_at?new Date(a.created_at).toLocaleString():''}));
  save();
}
async function connectApi(){
  apiBase=($('#apiurl')?.value||apiBase).trim().replace(/\/$/,'');
  localStorage.setItem('ll_api',apiBase);
  try{
    const health=await api('/api/health'); backendMode=true;apiOnline=true;
    await syncBackend();
    const mode=health.demo_mode?'Deterministic extraction mode':'Live LLM extraction mode';
    const result=$('#apiresult');if(result)result.textContent=`Connected · ${mode} · API database is the source of truth.`;
    $('#connection').innerHTML='<span class="dot"></span><span>Backend connected · live data</span>';
    render();toast('Backend connected. Live database data loaded.');
  }catch(e){backendMode=false;apiOnline=false;
    const result=$('#apiresult');if(result)result.textContent=`Connection failed: ${e.message}. Start the API and try again.`;
    $('#connection').innerHTML='<span class="dot" style="background:var(--amber)"></span><span>Local demo mode</span>';
    toast('Backend connection failed: '+e.message);
  }
}
async function processMeeting(){
  const title=$('#mtitle').value.trim(),date=$('#mdate').value||today(),att=($('#matt').value||'').split(',').map(x=>x.trim()).filter(Boolean),text=$('#mtext').value.trim(),file=$('#mfile').files[0];
  if(!title)return toast('Add a meeting title first');if(!text&&!file)return toast('Paste a transcript or upload a file');
  if(!backendMode){if(file){const r=new FileReader();r.onload=()=>analyzeMeeting(title,date,att,r.result);r.readAsText(file)}else analyzeMeeting(title,date,att,text);return}
  if(backendBusy)return;backendBusy=true;
  try{
    const fd=new FormData();fd.append('title',title);fd.append('meeting_date',date);fd.append('attendees',att.join(','));
    if(file)fd.append('file',file);else fd.append('text',text);
    const created=await api('/api/meetings',{method:'POST',body:fd});const id=created.meeting.id;
    await api(`/api/meetings/${id}/extract`,{method:'POST'});
    toast('Meeting saved. AI extraction is running…');
    let result;
    for(let i=0;i<50;i++){await new Promise(r=>setTimeout(r,600));result=await api(`/api/meetings/${id}/items`);if(['extracted','failed'].includes(result.status))break;}
    if(result?.status==='failed')throw new Error(result.error||'Extraction failed');
    if(result?.status!=='extracted')throw new Error('Extraction is taking longer than expected. Reopen the meeting in a moment and refresh the backend.');
    await syncBackend();closeModal();setView('review');
    toast(`${(result.decisions||[]).length} decisions and ${(result.action_items||[]).length} action items extracted`);
  }catch(e){toast('Could not process meeting: '+e.message)}finally{backendBusy=false}
}
async function approveItem(id){
  if(!backendMode){const r=db.review.find(x=>x.id===id);if(!r)return;if(r.type==='decision'){db.decisions.push({id:'d'+uid(),meeting:db.meetings.at(-1).id,text:r.text,quote:r.quote,speaker:r.speaker,time:r.time,status:'active',confidence:r.confidence,category:r.category})}else{const owner=$('#owner-'+id)?.value||r.owner||'',due=$('#due-'+id)?.value||r.due||'';if(!owner||!due)return toast('Assign an owner and deadline before approval');db.tasks.push({id:'t'+uid(),title:r.text,owner,due,status:'todo',source:meetingName(db.meetings.at(-1).id)})}db.review=db.review.filter(x=>x.id!==id);addAudit(`Approved: ${r.text}`);render();toast('Approved');return}
  const r=db.review.find(x=>x.id===id);if(!r)return;
  try{if(r.type==='decision')await api(`/api/review/decisions/${r.backendId}/approve`,{method:'POST'});else{
    const owner=$('#owner-'+id)?.value||r.owner||'',due=$('#due-'+id)?.value||r.due||'';
    if(!owner||!due)return toast('Assign an owner and deadline before approval');
    await api(`/api/review/actions/${r.backendId}`,{method:'PATCH',body:{owner,deadline:due}});
    await api(`/api/review/actions/${r.backendId}/approve`,{method:'POST'});
  }
  await syncBackend();render();toast(r.type==='task'?'Task approved and created in the selected tracker':'Decision approved and saved to memory');
  }catch(e){toast('Approval failed: '+e.message)}
}
async function rejectItem(id){
  if(!backendMode){const r=db.review.find(x=>x.id===id);db.review=db.review.filter(x=>x.id!==id);addAudit(`Rejected suggestion: ${r?.text||id}`);render();toast('Rejected');return}
  const r=db.review.find(x=>x.id===id);if(!r)return;
  try{await api(`/api/review/${r.type==='decision'?'decisions':'actions'}/${r.backendId}/reject`,{method:'POST'});await syncBackend();render();toast('Suggestion rejected')}catch(e){toast('Could not reject item: '+e.message)}
}
async function resolveConflict(id,how){
  if(!backendMode){const c=db.conflicts.find(x=>x.id===id);if(!c)return;c.resolved=true;if(how==='replace'){const old=db.decisions.find(d=>d.id===c.oldId);if(old)old.status='superseded';const n=c.newDecision;db.decisions.push({id:'d'+uid(),meeting:db.meetings.at(-1).id,text:n.text,quote:n.quote,speaker:n.speaker,time:n.time,status:'active',confidence:n.confidence,category:n.category})}addAudit(`Conflict resolved: ${how} · ${c.title}`);render();toast('Decision history updated');return}
  const c=db.conflicts.find(x=>x.id===id);if(!c)return;
  const resolution=how==='replace'?'supersede_old':how==='keep'?'keep_old':'exception';
  try{await api(`/api/conflicts/${c.backendId}/resolve`,{method:'POST',body:{resolution}});await syncBackend();render();toast('Conflict resolution saved to decision history')}catch(e){toast('Could not resolve conflict: '+e.message)}
}
async function moveTask(id,status){
  if(!backendMode){const t=db.tasks.find(x=>x.id===id);if(t){t.status=status;addAudit(`Task status changed: ${t.title} → ${status}`);render();toast('Task updated')}return}
  const t=db.tasks.find(x=>x.id===id);if(!t)return;
  try{await api(`/api/tasks/${t.backendId}/status`,{method:'PATCH',body:{status:status==='doing'?'in_progress':status}});await syncBackend();render();toast('Task status updated')}catch(e){toast('Task update failed: '+e.message)}
}
function loadSampleConflict(){if(backendMode){toast('In live mode, upload a second meeting with a changed decision to trigger real conflict detection.');setView('meetings');return}const old=db.decisions.find(d=>/postgres/i.test(d.text));if(!old){toast('Add a PostgreSQL decision first');return}if(db.conflicts.some(c=>!c.resolved)){setView('review');toast('There is already an open conflict');return}db.conflicts.push({id:uid(),kind:'Technology change',title:'Database choice changed between meetings',old:old.text,next:'Switch the primary database to MongoDB',oldMeeting:meetingName(old.meeting),newMeeting:'Data layer architecture review',reason:'The new proposal conflicts with the active PostgreSQL decision. Ledgerline found the earlier commitment in the decision memory.',oldId:old.id,newDecision:{text:'Switch the primary database to MongoDB',quote:'We decided to switch to MongoDB for the primary database.',speaker:'Rahul',time:'00:03:12',confidence:94,category:'Technology'}});addAudit('Potential contradiction detected across meetings');setView('review');toast('Demo conflict generated')}
function addTaskModal(){if(backendMode){toast('Create tasks from meeting action items so they retain transcript evidence and approval history.');return}openModal(`<div class="modalhead"><h2>Create a commitment</h2><button class="close" onclick="closeModal()">×</button></div><div class="fieldblock"><label class="label">Task</label><input class="field" id="nt" style="width:100%"></div><div class="fieldblock"><label class="label">Owner</label><input class="field" id="no" style="width:100%"></div><div class="fieldblock"><label class="label">Due date</label><input class="field" id="nd" type="date" style="width:100%"></div><div class="reviewactions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveTask()">Create task</button></div>`)}
async function viewMeeting(id){
  let m=db.meetings.find(x=>x.id===id);if(!m)return;
  if(backendMode){try{const d=await api(`/api/meetings/${m.backendId}`);m.transcript=d.meeting?.raw_text||m.transcript;m.attendees=d.meeting?.attendees||m.attendees;}catch(e){toast(e.message)}}
  openModal(`<div class="modalhead"><div><div class="eyebrow">MEETING RECORD</div><h2>${esc(m.title)}</h2></div><button class="close" onclick="closeModal()">×</button></div><p class="muted small">${fmt(m.date)} · ${(m.attendees||[]).map(esc).join(', ')}</p><div class="fieldblock"><label class="label">Original transcript</label><pre style="white-space:pre-wrap;background:#0b111a;padding:14px;border-radius:10px;color:#aab8cf;font:11px/1.6 ui-monospace">${esc(m.transcript||'Transcript unavailable')}</pre></div>`)
}
// Auto-connect on page load; user can still use the local demo if API is offline.

document.querySelector('.sidebar').addEventListener('click',e=>{const b=e.target.closest('.sidebar [data-view]');if(b)setView(b.dataset.view)});$('#topNew').onclick=openMeeting;$('#helpBtn').onclick=()=>openModal(`<div class="modalhead"><h2>How to demo Ledgerline</h2><button class="close" onclick="closeModal()">×</button></div><ol class="muted"><li>Open Meetings and add a transcript with speaker names.</li><li>Review the extracted decisions and action items.</li><li>Assign missing owners and deadlines, then approve.</li><li>Use “Run live demo” on Overview to show cross-meeting conflict detection.</li><li>Resolve the conflict and inspect Decision Memory and the Execution Board.</li></ol><p class="small muted">This standalone demo persists in your browser. For live LLM extraction and external integrations, run the FastAPI backend and configure its environment.</p>`);
render();connectApi().catch(()=>{});
</script></body></html>
